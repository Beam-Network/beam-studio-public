global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/beam-alerts.yml

# /metrics now requires the deployment's operations token, because it exposes
# per-route request counts, worker load and workflow run totals. Derive it once
# and put it in a file Prometheus can read:
#
#   node -e 'const {createHmac}=require("node:crypto");
#     process.stdout.write(createHmac("sha256", process.env.BEAM_STUDIO_SECRET_KEY)
#       .update("beam-studio.ops.v1").digest("base64url"))' > /etc/prometheus/ops-token
#
# Rotating BEAM_STUDIO_SECRET_KEY rotates this with it.
scrape_configs:
  - job_name: beam-api
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ops-token
    static_configs:
      - targets: ["host.docker.internal:8787"]
  - job_name: beam-orchestrator
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ops-token
    static_configs:
      - targets: ["host.docker.internal:8788"]
  - job_name: beam-worker
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ops-token
    static_configs:
      - targets: ["host.docker.internal:8790"]
